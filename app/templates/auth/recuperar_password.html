{% extends "base.html" %}
{% block title %}Recuperar contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm p-4 mt-5">
      <h5 class="fw-bold mb-1">Recuperar contraseña</h5>
      <p class="text-muted small mb-4">Ingresa tu correo institucional y te enviaremos instrucciones.</p>
      <form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Correo electrónico</label>
          <input type="email" name="correo" class="form-control" required autofocus>
        </div>
        <button type="submit" class="btn btn-gold w-100">Enviar instrucciones</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('auth.login') }}" class="small">&larr; Volver al inicio de sesión</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
