{% extends "base.html" %}
{% block title %}Nueva contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm p-4 mt-5">
      <h5 class="fw-bold mb-3">Define tu nueva contraseña</h5>
      <form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Nueva contraseña</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Confirmar contraseña</label>
          <input type="password" name="password_confirm" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Guardar contraseña</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
